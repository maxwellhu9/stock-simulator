[project]
name = "paper-exchange-backend"
version = "0.1.0"
description = "Paper trading exchange - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 15

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
