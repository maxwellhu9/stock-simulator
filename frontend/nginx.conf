server {
    # Both stacks. Without the IPv6 line nginx binds 0.0.0.0 only, and anything
    # resolving "localhost" to ::1 first -- busybox wget, for one -- is refused.
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every unknown path is a client-side route, so serve
    # index.html rather than a 404 and let React decide what it means.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
